[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -q
    --strict-markers
    --tb=short

markers =
    db: reaches the company SQL Server. Skipped unless ZBDGT_DB_TESTS=1 is set
        on purpose. Every such test works inside a transaction it rolls back.
    security: crypto and isolation tests. These must never be skipped or
        marked xfail - test_crypto.py above all.
    slow: takes more than a few seconds (the million-nonce test, the benchmark).

filterwarnings =
    ignore::DeprecationWarning
