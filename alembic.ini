# Alembic configuration
#
# Deliberately NO sqlalchemy.url here - same as QUOT. The connection is built
# in app/core/config.py from .env and carries the database password; a copy in
# a tracked ini file would leak it and give migrations a second source of
# truth. alembic/env.py uses the application's own engine factory instead.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Timestamped revision filenames, so `ls alembic/versions` reads in order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
