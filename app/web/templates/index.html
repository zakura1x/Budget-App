<!doctype html>
<html lang="en"{% if theme %} data-theme="{{ theme }}"{% endif %}>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Budget" />
    <meta name="referrer" content="no-referrer" />
    <meta name="app-base" content="{{ base_url }}" />
    <meta name="app-api" content="{{ api_prefix }}" />
    <link rel="manifest" href="{{ base_url }}/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="{{ base_url }}/static/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="{{ base_url }}/static/icons/apple-touch-icon.png" />
    <title>{{ app_name }}</title>
    {% if entry %}
      {% for css in entry.css %}
    <link rel="stylesheet" href="{{ dist_url }}/{{ css }}" />
      {% endfor %}
    <script type="module" nonce="{{ nonce }}" src="{{ dist_url }}/{{ entry.js }}"></script>
    {% endif %}
  </head>
  <body>
    <div id="root">
      {% if not entry %}
      <main>
        <h1>{{ app_name }}</h1>
        <p>The frontend has not been built yet.</p>
        <p>On your PC: <code>cd frontend</code>, then <code>npm run build</code>.
           It writes into app/web/static/dist/.</p>
      </main>
      {% endif %}
    </div>
  </body>
</html>
